<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements</title>
<style>
  :root{
    --purple:#5b2a86;
    --gold:#f5b400;
    --pill-bg:#fdf0cf;
    --pill-text:#d3a017;
    --ink:#3a3f4a;
    --muted:#5a6270;
    --icon-bg:#ece5f6;
    --icon:#6a3fa0;
    --card-border:#ececf0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#fff;
    color:var(--ink);
  }
  .section{
    max-width:1000px;
    margin:0 auto;
    padding:56px 24px 72px;
    text-align:center;
  }
  .pill{
    display:inline-block;
    background:var(--pill-bg);
    color:var(--pill-text);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:8px 18px;
    border-radius:999px;
  }
  h1{
    color:var(--purple);
    font-size:44px;
    font-weight:800;
    margin:18px 0 40px;
    letter-spacing:-.5px;
  }
  .card{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:18px;
    text-align:left;
    background:#fff;
    border:1px solid var(--card-border);
    border-left:5px solid var(--gold);
    border-radius:12px;
    padding:22px 26px;
    box-shadow:0 1px 3px rgba(20,20,40,.05);
  }
  .icon{
    flex:0 0 auto;
    width:40px;height:40px;
    border-radius:10px;
    background:var(--icon-bg);
    color:var(--icon);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:400;line-height:1;
  }
  .card h2{
    margin:2px 0 6px;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .card p{
    margin:0;
    font-size:15.5px;
    line-height:1.55;
    color:var(--muted);
  }
  .card p strong{color:var(--ink);font-weight:700;}
</style>
</head>
<body>
  <section class="section">
    <span class="pill">Stay in the Loop</span>
    <h1>Announcements</h1>

    <div class="card">
      <div class="icon">+</div>
      <div class="body">
        <h2>Science Olympiad Kickoff &amp; Information Session</h2>
        <p>Join us on <strong>Friday, August 14th at 6:30 PM</strong>. The Zoom link has been sent to everyone on the interest list. If you haven't received it, email us.</p>
      </div>
    </div>
  </section>
</body>
</html>
